name: Build and publish GIP datasets

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Vienna'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gip-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      fingerprint: ${{ steps.check.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - name: Check GIP lookup JavaScript syntax
        run: node --check gip-lookups/build.mjs
      - name: Check GIP source fingerprint
        id: check
        env:
          PUBLIC_FINGERPRINT_URL: https://peter-alexander.github.io/ks-GIP/source-fingerprint.txt
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          BUILD_PMTILES: 'true'
          BUILD_LEGACY_TILES: 'false'
        run: bash scripts/check-gip.sh

  build-network:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip curl jq tippecanoe
      - name: Build original network PMTiles
        env:
          BUILD_PMTILES: 'true'
          BUILD_LEGACY_TILES: 'false'
          EINBAHN_WHERE: ${{ vars.EINBAHN_WHERE || '' }}
        run: bash scripts/build-network-job.sh
      - uses: actions/upload-artifact@v7
        with:
          name: gip-network
          path: dist/network/*.pmtiles
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-reference:
    needs: [check, build-network]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip curl jq tippecanoe
      - name: Build original reference PMTiles
        env:
          BUILD_PMTILES: 'true'
          BUILD_LEGACY_TILES: 'false'
        run: bash scripts/build-reference-job.sh
      - uses: actions/upload-artifact@v7
        with:
          name: gip-reference
          path: dist/reference/*.pmtiles
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [check, build-network, build-reference]
    if: needs.check.outputs.should_build == 'true' && needs.build-network.result == 'success' && needs.build-reference.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: gip-network
          path: dist/network
      - uses: actions/download-artifact@v8
        with:
          name: gip-reference
          path: dist/reference
      - name: Build original GIP lookup catalog
        run: bash gip-lookups/run.sh
      - name: Assemble Pages site and check size
        env:
          GIP_FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import time

          outputs = {
              "link.pmtiles": Path("dist/network/link.pmtiles"),
              "link-speed.pmtiles": Path("dist/network/link-speed.pmtiles"),
              "link-einbahn.pmtiles": Path("dist/network/link-einbahn.pmtiles"),
              "linear-use.pmtiles": Path("dist/network/linear-use.pmtiles"),
              "rfa.pmtiles": Path("dist/reference/rfa.pmtiles"),
              "GipLookups.json": Path("gip-lookups/build/GipLookups.json"),
          }
          missing = [str(p) for p in outputs.values() if not p.is_file() or p.stat().st_size == 0]
          if missing:
              raise SystemExit("Missing or empty build output: " + ", ".join(missing))
          total = sum(p.stat().st_size for p in outputs.values())
          print("Total published bytes:", total)
          if total > 1_000_000_000:
              raise SystemExit("GitHub Pages cannot publish a site over 1 GB. No deployment attempted.")
          public = Path("pages")
          public.mkdir(exist_ok=True)
          for name, path in outputs.items():
              shutil.copy2(path, public / name)
          (public / "source-fingerprint.txt").write_text(os.environ["GIP_FINGERPRINT"] + "\n")
          stamp = str(int(time.time()))
          (public / "asset-versions.json").write_text(
              json.dumps({"schema": 1, "files": {name: stamp for name in outputs}}, indent=2) + "\n"
          )
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Kartensammlung asset versions
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          test -n "$HOST"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "https://${HOST}/Maps/AssetVersions/refresh.php?repo=ks-GIP"
